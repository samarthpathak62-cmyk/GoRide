name: Build Driver App APK

on:
  push:
    branches: [ main, arena/f0b1026b-goride ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: goride_driver_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Firebase options
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          // File generated automatically by GitHub Actions.
          // Do not edit manually.

          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                throw UnsupportedError(
                  'DefaultFirebaseOptions have not been configured for web.',
                );
              }

              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions have not been configured for iOS.',
                  );
                case TargetPlatform.macOS:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions have not been configured for macOS.',
                  );
                case TargetPlatform.windows:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions have not been configured for Windows.',
                  );
                case TargetPlatform.linux:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions have not been configured for Linux.',
                  );
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform.',
                  );
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyAfDZ4ghUIJMG58KKSjIkT79xZ0PjEh-0A',
              appId: '1:1046643741285:android:bd5f501d0ffaedfdcd2c8c',
              messagingSenderId: '1046643741285',
              projectId: 'goride-1bd25',
              storageBucket: 'goride-1bd25.firebasestorage.app',
            );
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: goride-driver-apk
          path: goride_driver_app/build/app/outputs/flutter-apk/app-release.apk
